type: application
title: Fermer les portes de SSH
summary: Interdire les mots de passe et la connexion directe de root, en vérifiant la configuration effective et sans se couper l'accès.
competences: [l5-sshd]
hints:
  - level: comprehension
    text: "Avant de fermer quoi que ce soit, par quel moyen te connecteras-tu au compte deploy une fois les mots de passe interdits ? Est-ce déjà en place et testé ?"
  - level: demarche
    text: "Après ta modification, que répond le serveur à `ssh -o PreferredAuthentications=none -p 47553 deploy@127.0.0.1` ? Et que dit `sudo sshd -T | grep -Ei 'passwordauth|permitroot'` ?"
  - level: zone
    text: "Ta directive est bien écrite, mais la valeur effective ne change pas : quels autres fichiers sshd lit-il, dans quel ordre ? Lequel d'entre eux dit le contraire ?"
  - level: concept
    text: "Que dit le cours de la règle « première valeur lue » dans sshd_config.d ? Et de la procédure à suivre à chaque modification ?"
review:
  - "Qui a écrit 50-cloud-init.conf, et qu'arrivera-t-il à ta correction si l'hébergeur le réécrit ? Comment t'en protéger ?"
  - "Comment administres-tu le serveur en root maintenant que root ne peut plus se connecter ?"
